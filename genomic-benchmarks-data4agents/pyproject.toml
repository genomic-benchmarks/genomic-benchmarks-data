[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genomic-benchmarks-data4agents"
version = "0.0.1"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Agent-safe access to quality-curated genomic benchmarks datasets. "
requires-python = ">=3.12"

dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "platformdirs",
    "pyarrow",
    "requests",
    "scikit-learn",
    "tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["genomic_benchmarks_data4agents"]

[tool.hatch.build.targets.wheel.force-include]
"../shared/core" = "genomic_benchmarks_data4agents/_core"
