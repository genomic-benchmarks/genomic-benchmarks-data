[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-benchmarks-data"
version = "0.0.1"
description = "A package for accessing quality-curated genomic benchmark datasets. "
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name="Stephanie Sammut", email="sammutstephanie95@gmail.com" },
]
keywords = [
    "genomic benchmarks",
    "deep learning",
    "machine learning",
    "computational biology",
    "bioinformatics",
    "genomics",
    "datasets",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/genomic-benchmarks/genomic-benchmarks-data"
Repository = "https://github.com/genomic-benchmarks/genomic-benchmarks-data"
Issues = "https://github.com/genomic-benchmarks/genomic-benchmarks-data/issues"